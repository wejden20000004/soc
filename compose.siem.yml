# Phase 2a — containerized analytics.
# Native Suricata + Filebeat (windows/) ship into Logstash on port 5044.

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
      - ELASTIC_PASSWORD=${ES_PASSWORD}
    volumes:
      - es_siem_data:/usr/share/elasticsearch/data
    networks:
      - soc-backend
    mem_limit: 6g

  logstash:
    image: docker.elastic.co/logstash/logstash:8.18.0
    environment:
      - ES_PASSWORD=${ES_PASSWORD}
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"
    networks:
      - soc-backend
    mem_limit: 1500m

  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.0
    ports:
      - "5601:5601"
    networks:
      - soc-backend

  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:8.18.0
    ports:
      - "8220:8220"
    networks:
      - soc-backend

networks:
  soc-backend:
    external: true

volumes:
  es_siem_data: